name: Verify action

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: Verify generated bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - run: git diff --check
      - name: Verify generated bundle is committed
        shell: bash
        run: |
          if ! git diff --quiet -- dist/setup-temporal; then
            echo "::error file=dist/setup-temporal::The generated action bundle is stale. Run 'npm ci' and 'npm run build', then commit the changes under dist/setup-temporal/." >&2
            git diff -- dist/setup-temporal
            exit 1
          fi

  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Print build information
        env:
          HEAD_REF: ${{ github.head_ref }}
          REF: ${{ github.ref }}
          OS: ${{ matrix.os }}
        shell: bash
        run: 'echo "head_ref: $HEAD_REF, ref: $REF, os: $OS"'

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run temporalio/setup-temporal
        id: first
        uses: ./
        with:
          version: 1.9.1

      - name: Verify setup and remove the installed copy
        env:
          TEMPORAL_DIRECTORY: ${{ steps.first.outputs.path }}
        shell: bash
        run: |
          temporal -v
          node -e 'require("node:fs").rmSync(process.env.TEMPORAL_DIRECTORY, { recursive: true, force: true })'

      - name: Restore Temporal CLI from the remote cache
        id: restored
        uses: ./
        with:
          version: 1.9.1

      - name: Verify cache hit and CLI execution
        env:
          CACHE_HIT: ${{ steps.restored.outputs.cache-hit }}
        shell: bash
        run: |
          test "$CACHE_HIT" = true
          temporal -v

      - name: Install the latest version with caching disabled
        id: uncached
        uses: ./
        with:
          cache: 'false'

      - name: Verify uncached setup
        env:
          CACHE_HIT: ${{ steps.uncached.outputs.cache-hit }}
        shell: bash
        run: |
          test "$CACHE_HIT" = false
          temporal -v
